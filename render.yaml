# LAPENG HACKATHON DEMO — FREE INSTANCE ONLY; no paid disks/databases.
# WARNING: database and uploads on this service are EPHEMERAL and reset on restarts/spin-down.
services:
  - type: web
    name: lapeng-free-demo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1 --proxy-headers
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: LAPENG_DB
        value: /tmp/lapeng-demo.sqlite3
      - key: LAPENG_MEDIA_DIR
        value: /tmp/lapeng-demo-uploads
      - key: LAPENG_DEMO_DATA
        value: '1'
      - key: PAYPAL_MODE
        value: sandbox
      - key: APP_SECRET
        generateValue: true
      - key: APP_BASE_URL
        sync: false
      - key: AI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: AI_MODEL
        value: openai/gpt-oss-120b
      - key: AI_API_KEY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
